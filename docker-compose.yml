# Deploy Tirtonichub di PC server (Docker Desktop + WSL2).
# MinIO sudah jalan di host → set S3_ENDPOINT=http://host.docker.internal:9000 di .env.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tirtonic
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD di .env}
      POSTGRES_DB: tirtonichub
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Mau data Postgres di D:\server-data? ganti baris atas jadi:
      #   - D:/server-data/postgres:/var/lib/postgresql/data
    restart: unless-stopped

  app:
    build: .
    env_file: .env
    environment:
      # Override DATABASE_URL dari .env → arahkan ke service db.
      DATABASE_URL: postgresql://tirtonic:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD di .env}@db:5432/tirtonichub
    ports:
      - "3000:3000"
    depends_on:
      - db
    restart: unless-stopped

volumes:
  pgdata:
