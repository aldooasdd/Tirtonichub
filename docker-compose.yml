# Infra dev lokal: PostgreSQL + MinIO.
# WAHA & n8n pakai instance yang sudah ada (bukan di sini). App dijalankan `pnpm dev`.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tirtonic
      POSTGRES_PASSWORD: tirtonic
      POSTGRES_DB: tirtonichub
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # console
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
