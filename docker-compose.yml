# Stack app Tirtonic di PC: Postgres + web (Next.js). Build di sini (mesin penuh, bukan cPanel).
# cloudflared & minio jalan di compose-mu yang lain (host). web dipublish ke host:3000,
# cloudflared route tirtonichub.com -> http://host.docker.internal:3000 (lihat DEPLOY_PC.md).
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000" # cloudflared -> host.docker.internal:3000

volumes:
  pgdata:
