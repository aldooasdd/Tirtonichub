# Infra dev lokal: PostgreSQL saja.
# MinIO: produksi jalan di PC server kantor (via Cloudflare Tunnel/Tailscale, lihat PRD §15/§17).
# Dev tanpa S3 env → storage.ts fallback simpan ke .data/uploads (lihat src/server/storage.ts).
# WAHA & n8n pakai instance yang sudah ada.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tirtonic
      POSTGRES_PASSWORD: tirtonic
      POSTGRES_DB: tirtonichub
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
