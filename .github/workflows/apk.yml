# APK kasir iMin (android/). Hasil: artifact "tirtonic-pos-apk" di halaman run Actions (perlu login GitHub).
name: APK kasir
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/apk.yml"]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.11.1" }
      - run: gradle -p android assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: tirtonic-pos-apk, path: android/app/build/outputs/apk/debug/app-debug.apk }
